<style>html,body{height:100%;margin:0;background:#f1f3ee;font-family:Manrope,system-ui,sans-serif}
three-d-stage:not(:defined){visibility:hidden}
three-d-stage{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body>
<three-d-stage id="stage" name="masterskaya-room2" background="#f1f3ee" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('#stage');
const ready = await stage.ready;
window.__WORKSHOP_THREE__ = ready.THREE;
const { buildWorkshop } = await import('./workshop-model.js');
stage.setObject(buildWorkshop());
const sr = stage.shadowRoot;
const note = sr.querySelector('.note');
if (note) { note.textContent = 'Тянуть — вращать · колесо — приближать'; note.style.cssText += 'left:50%;bottom:16px;transform:translateX(-50%);text-align:center;max-width:min(420px,70vw);'; }
const toolbar = sr.querySelector('.toolbar');
if (toolbar) toolbar.style.display = 'none';
</script>
</body></html>
